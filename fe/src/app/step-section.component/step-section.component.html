<div class="bg-white shadow-sm p-4 rounded-md mb-[20px]">
  <div class="flex justify-between items-center mb-3">
    <h3 class="font-semibold">{{ stepTitle }}</h3>
    <span class="text-sm px-2 py-0.5 rounded"
      [ngClass]="{
        'bg-green-100 text-green-700': statusColor === 'green',
        'bg-yellow-100 text-yellow-700': statusColor === 'yellow',
        'bg-red-100 text-red-700': statusColor === 'red'
      }">
      {{ status }}
    </span>
  </div>

  <div *ngFor="let item of items" class="flex justify-between items-center test">
    <div class="flex items-center space-x-2">
      <div class="bg-gray-200 rounded-full p-2">
        <ng-container [ngSwitch]="icon">
          <!-- Shield Icon -->
          <svg *ngSwitchCase="'shield-user'" class="w-5 h-5 text-gray-600" fill="currentColor" viewBox="0 0 24 24">
            <path d="M12 2C12 2 4 5 4 10c0 6.075 4.925 10 8 10s8-3.925 8-10c0-5-8-8-8-8zm0 14a6 6 0 01-6-6c0-2.635 3.18-4.65 6-5.72 2.82 1.07 6 3.085 6 5.72a6 6 0 01-6 6z"/>
            <path d="M12 11a2 2 0 110-4 2 2 0 010 4zm-3 4c.54-1.32 1.79-2 3-2s2.46.68 3 2H9z"/>
          </svg>

          <!-- Airplane Icon -->
          <svg *ngSwitchCase="'airplane'" class="w-5 h-5 text-gray-600" fill="currentColor" viewBox="0 0 122.88 122.88" style="enable-background:new 0 0 122.88 122.88;">
          <style type="text/css">
            .st0{fill-rule:evenodd;clip-rule:evenodd;}
          </style>
          <g>
            <path class="st0" d="M16.63,105.75c0.01-4.03,2.3-7.97,6.03-12.38L1.09,79.73c-1.36-0.59-1.33-1.42-0.54-2.4l4.57-3.9
              c0.83-0.51,1.71-0.73,2.66-0.47l26.62,4.5l22.18-24.02L4.8,18.41c-1.31-0.77-1.42-1.64-0.07-2.65l7.47-5.96l67.5,18.97L99.64,7.45
              c6.69-5.79,13.19-8.38,18.18-7.15c2.75,0.68,3.72,1.5,4.57,4.08c1.65,5.06-0.91,11.86-6.96,18.86L94.11,43.18l18.97,67.5
              l-5.96,7.47c-1.01,1.34-1.88,1.23-2.65-0.07L69.43,66.31L45.41,88.48l4.5,26.62c0.26,0.94,0.05,1.82-0.47,2.66l-3.9,4.57
              c-0.97,0.79-1.81,0.82-2.4-0.54l-13.64-21.57c-4.43,3.74-8.37,6.03-12.42,6.03C16.71,106.24,16.63,106.11,16.63,105.75
              L16.63,105.75z"/>
          </g>
          </svg>


          <!-- User Icon -->
          <svg *ngSwitchCase="'user'" class="w-5 h-5 text-gray-600" fill="currentColor" viewBox="0 0 24 24">
            <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.6 0-10.8 1.8-10.8 5.4V22h21.6v-2.2c0-3.6-7.2-5.4-10.8-5.4z"/>
          </svg>

          <!-- Fallback Icon -->
          <svg *ngSwitchDefault class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10" stroke-width="2"></circle>
            <line x1="12" y1="8" x2="12" y2="12" stroke-width="2"></line>
            <line x1="12" y1="16" x2="12" y2="16" stroke-width="2"></line>
          </svg>
        </ng-container>
      </div>

      <div>
        <div>{{ item.name }}</div>
        <div class="text-sm"
          [ngClass]="{
            'text-red-600': item.status === 'Pending information',
            'text-green-600': item.status === 'Updated'
          }">{{ item.status }}</div>
      </div>
    </div>

    <div class="flex space-x-2">
      <button class="bg-black text-white text-sm px-4 py-1 rounded">Edit</button>
      <button class="bg-gray-100 text-red-600 font-bold px-2 py-1 rounded">X</button>
    </div>
  </div>

  <button class="w-full bg-gray-100 text-xl text-gray-500 py-2 rounded">+</button>
</div>
